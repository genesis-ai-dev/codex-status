name: Status Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe API
        id: probe
        run: node scripts/probe-api.mjs > probe-output.json

      - name: Report to status page
        env:
          MONITOR_API_URL: ${{ secrets.MONITOR_API_URL }}
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
        run: |
          if [ -z "$MONITOR_API_URL" ] || [ -z "$MONITOR_API_KEY" ]; then
            echo "Secrets not set, skipping"
            exit 0
          fi
          curl -s -X POST "$MONITOR_API_URL/api/monitor" \
            -H "Content-Type: application/json" \
            -H "x-monitor-key: $MONITOR_API_KEY" \
            -d @probe-output.json
